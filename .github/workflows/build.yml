name: Build Aurora APK
on:
  push:
    branches: [android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build
        shell: bash
        env:
          AURORA_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle --no-daemon assembleRelease 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk aurora.apk
          ls -la aurora.apk
      - name: Publish APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aurora-latest
          name: Aurora for Fire TV (latest build)
          body: "Build ${{ github.run_number }} from ${{ github.sha }}"
          files: |
            aurora.apk
            build.log
          make_latest: true
      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aurora-build-log
          name: Aurora build log (last failure)
          body: "Failed build ${{ github.run_number }}"
          files: build.log
          prerelease: true
