:root {
  --cream: #f7efe2;
  --cream-dim: rgba(247, 239, 226, 0.72);
  --cream-faint: rgba(247, 239, 226, 0.42);
  --terracotta: #d2693a;
  --sea: #2f8f9d;
  --gold: #e8b45c;
  --glass: rgba(22, 18, 16, 0.58);
  --glass-edge: rgba(255, 240, 220, 0.16);
  --focus: #f3d9a4;
  --focus-glow: rgba(232, 180, 92, 0.45);
  --tile-w: 288px;
  --tile-h: 162px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-snap: cubic-bezier(0.34, 1.56, 0.64, 1);
  --serif: "Lora", Georgia, "Times New Roman", serif;
  --sans: "Poppins", "SamsungOne", "Segoe UI", Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 1920px; height: 1080px; overflow: hidden;
  background: #0d1218; color: var(--cream);
  font-family: var(--sans); font-weight: 300;
  -webkit-font-smoothing: antialiased; cursor: none;
}

/* ---------- background ---------- */
#bg {
  position: absolute; inset: 0; width: 1920px; height: 1080px; z-index: 0;
  transform: scale(1.03); will-change: transform;
  transition: transform 1200ms var(--ease);
}
.bg-layer {
  position: absolute; inset: 0; width: 1920px; height: 1080px;
  object-fit: cover; opacity: 0;
  transition: opacity 2200ms ease-in-out;
}
.bg-scene { opacity: 1; transition: opacity 2600ms ease-in-out; }
.bg-clip { object-fit: cover; transition: opacity 2600ms ease-in-out; }

#sprites { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.sprite { position: absolute; left: 0; top: 0; opacity: 0; will-change: transform, opacity; transform-origin: 50% 100%; }
.sprite svg { display: block; filter: drop-shadow(0 0 1px rgba(0,0,0,0.4)); }
.wake { position: absolute; left: 0; top: 0; height: 2px; opacity: 0; border-radius: 2px;
  background: linear-gradient(90deg, rgba(255,235,200,0) 0%, rgba(255,235,200,0.9) 60%, rgba(255,235,200,0) 100%); will-change: transform, opacity; }

/* ---------- scene picker ---------- */
.picker {
  position: absolute; inset: 0; z-index: 20; padding: 90px 96px 70px;
  display: flex; flex-direction: column; justify-content: flex-end; gap: 28px;
  background: linear-gradient(180deg, rgba(10,8,8,0.15), rgba(10,8,8,0.78) 55%, rgba(10,8,8,0.92));
  opacity: 0; pointer-events: none; transform: translateY(24px);
  transition: opacity 420ms var(--ease), transform 520ms var(--ease);
}
.picker.open { opacity: 1; transform: none; }
.picker-title { font-family: var(--serif); font-style: italic; font-size: 44px; color: var(--cream); }
.picker-sub { margin-top: 6px; font-size: 15px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--cream-faint); }
.picker-row { display: flex; gap: 18px; padding: 16px 6px; will-change: transform; transition: transform 500ms var(--ease); }
.pcard {
  position: relative; flex: 0 0 auto; width: 296px; height: 166px; border-radius: 16px; overflow: hidden;
  border: 1px solid var(--glass-edge); background: #15110f center/cover no-repeat;
  transform: scale(1); transition: transform 380ms var(--ease-snap), opacity 300ms; opacity: 0.78;
  box-shadow: 0 16px 40px rgba(0,0,0,0.45);
}
.pcard::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.72)); }
.pcard .pc-title { position: absolute; left: 18px; bottom: 16px; z-index: 1; font-family: var(--serif); font-size: 22px; color: var(--cream); }
.pcard .pc-place { position: absolute; left: 18px; bottom: 44px; z-index: 1; font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--cream-dim); }
.pcard .pc-badge { position: absolute; right: 14px; top: 12px; z-index: 1; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px; background: rgba(232,180,92,0.18); border: 1px solid rgba(232,180,92,0.5); color: var(--gold); opacity: 0; }
.pcard.active .pc-badge { opacity: 1; }
.pcard.auto { display: flex; align-items: center; justify-content: center; background: rgba(26,22,20,0.6); }
.pcard.auto .pc-auto { font-family: var(--serif); font-style: italic; font-size: 26px; color: var(--cream); z-index: 1; }
.pcard.focused { transform: scale(1.08); opacity: 1; box-shadow: 0 0 0 2px var(--focus), 0 22px 60px var(--focus-glow); }
.picker-foot { display: flex; justify-content: space-between; align-items: center; }
.picker-group { display: flex; align-items: center; gap: 10px; }
.pg-label { font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--cream-faint); margin-right: 8px; }
.pill { padding: 8px 16px; border-radius: 999px; font-size: 15px; color: var(--cream-dim); border: 1px solid rgba(255,240,220,0.14); transition: all 250ms; }
.pill.on { color: var(--cream); background: rgba(255,240,220,0.10); }
.picker-group.focused .pill.on { box-shadow: 0 0 0 2px var(--focus); color: var(--focus); }
.picker-hint { font-size: 13px; letter-spacing: 0.1em; color: var(--cream-faint); }
.picker-hint b { color: var(--cream-dim); font-weight: 500; }

/* colour grade per period — a cinematic LUT in two gradients */
#grade { position: absolute; inset: 0; z-index: 1; pointer-events: none; transition: opacity 2200ms ease; }
/* the footage carries its own light; the period grade is now just a soft vignette so the frame edges fall off */
body[data-period="day"]    #grade { background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 55%, rgba(10,20,30,0.32) 100%), linear-gradient(180deg, rgba(0,0,0,0.04), rgba(0,0,0,0) 30%, rgba(0,0,0,0.28) 100%); }
body[data-period="golden"] #grade { background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 55%, rgba(40,20,10,0.32) 100%), linear-gradient(180deg, rgba(0,0,0,0.05), rgba(0,0,0,0) 30%, rgba(0,0,0,0.30) 100%); }
body[data-period="dusk"]   #grade { background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 55%, rgba(20,10,30,0.32) 100%), linear-gradient(180deg, rgba(0,0,0,0.06), rgba(0,0,0,0) 30%, rgba(0,0,0,0.30) 100%); }
body[data-period="night"]  #grade { background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,5,15,0.30) 100%), linear-gradient(180deg, rgba(0,0,0,0.06), rgba(0,0,0,0) 30%, rgba(0,0,0,0.30) 100%); }

/* legibility scrim between the scene and the UI; relaxes in ambient mode */
#scrim { position: absolute; inset: 0; z-index: 2; pointer-events: none; transition: opacity 900ms var(--ease);
  background:
    linear-gradient(90deg, rgba(12,10,10,0.62) 0%, rgba(12,10,10,0.38) 28%, rgba(12,10,10,0.10) 52%, rgba(12,10,10,0) 70%),
    linear-gradient(180deg, rgba(12,10,10,0.30) 0%, rgba(12,10,10,0) 18%, rgba(12,10,10,0) 40%, rgba(12,10,10,0.55) 72%, rgba(12,10,10,0.78) 100%); }
body.ambient #scrim { opacity: 0.35; }
#dust { position: absolute; inset: 0; width: 1920px; height: 1080px; z-index: 2; pointer-events: none; opacity: 0.7; }

/* ---------- stage ---------- */
.stage {
  position: absolute; inset: 0; z-index: 3;
  padding: 56px 96px 40px;
  display: flex; flex-direction: column;
  opacity: 0; transform: translateY(14px);
  transition: opacity 900ms var(--ease), transform 1100ms var(--ease);
}
.stage.ready { opacity: 1; transform: none; }

.topbar { display: flex; justify-content: space-between; align-items: center; height: 48px; }
.brand { text-shadow: 0 2px 10px rgba(0,0,0,0.85); display: flex; align-items: center; gap: 16px; font-family: var(--serif); font-style: italic; font-size: 24px; color: var(--cream-dim); letter-spacing: 0.04em; }
.brand-rule { width: 44px; height: 1px; background: var(--gold); opacity: 0.8; }

.weather { text-shadow: 0 2px 10px rgba(0,0,0,0.85); display: flex; align-items: baseline; gap: 14px; color: var(--cream-dim); }
.wx-icon { font-size: 24px; }
.wx-temp { font-family: var(--serif); font-size: 34px; color: var(--cream); }
.wx-desc { font-size: 15px; letter-spacing: 0.22em; text-transform: uppercase; }

/* ---------- hero ---------- */
.hero { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 22px;
        transform-origin: left bottom; transition: transform 700ms var(--ease), opacity 600ms var(--ease); }
.clock .time {
  font-family: var(--serif); font-weight: 400; font-size: 132px; line-height: 1; letter-spacing: -0.02em;
  text-shadow: 0 4px 18px rgba(0,0,0,0.75), 0 14px 60px rgba(0,0,0,0.6);
}
.clock .date { text-shadow: 0 2px 12px rgba(0,0,0,0.8); margin-top: 12px; font-size: 20px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--cream-dim); }
.greeting { text-shadow: 0 2px 12px rgba(0,0,0,0.8); margin-top: 18px; font-family: var(--serif); font-style: italic; font-size: 32px; color: var(--cream-faint); transition: opacity 400ms; }
.stage.browsing .hero { transform: translateY(-110px) scale(0.46); opacity: 0.7; }
.stage.browsing .greeting, .stage.browsing .date { opacity: 0; }
.clock .date { transition: opacity 300ms; }

/* ---------- rows ---------- */
.rows { display: flex; flex-direction: column; gap: 26px; will-change: transform; transition: transform 650ms var(--ease); }
.row { opacity: 0; transform: translateY(24px); transition: opacity 700ms var(--ease), transform 900ms var(--ease); }
.stage.ready .row { opacity: 1; transform: none; }
.stage.ready .row:nth-child(1) { transition-delay: 150ms; }
.stage.ready .row:nth-child(2) { transition-delay: 300ms; }
.stage.ready .row:nth-child(3) { transition-delay: 450ms; }
.row.passed { opacity: 0 !important; transform: translateY(-20px) !important; }

.row-title {
  text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  font-family: var(--serif); font-style: italic; font-size: 21px; color: var(--cream-faint);
  margin-bottom: 10px; padding-left: 4px; transition: color 400ms var(--ease);
}
.row.active .row-title { color: var(--gold); }

.tiles { display: flex; gap: 20px; padding: 14px 0 14px 6px; will-change: transform; transition: transform 520ms var(--ease); }

/* ---------- tile ---------- */
.tile {
  position: relative; width: var(--tile-w); height: var(--tile-h); flex: 0 0 auto;
  border-radius: 18px; background: var(--glass); border: 1px solid var(--glass-edge);
  overflow: hidden; transform: translateZ(0) scale(1);
  transition: transform 420ms var(--ease-snap), opacity 400ms var(--ease);
  will-change: transform;
  box-shadow: 0 18px 40px rgba(0,0,0,0.35);
}
.tile::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,240,220,0.12), rgba(255,240,220,0) 50%); pointer-events: none; }
.tile::after {
  content: ""; position: absolute; inset: -1px; border-radius: 19px;
  border: 2px solid var(--focus);
  box-shadow: 0 0 0 6px rgba(243,217,164,0.12), 0 22px 60px var(--focus-glow);
  opacity: 0; transition: opacity 300ms var(--ease); pointer-events: none;
}
.tile.focused { transform: translateZ(0) scale(1.1); z-index: 2; }
.tile.focused::after { opacity: 1; }
.row:not(.active) .tile { opacity: 0.74; }
.row.active .tile:not(.focused) { opacity: 0.88; }

.tile .accent {
  position: absolute; inset: 0; opacity: 0.9;
  background: radial-gradient(120% 100% at 15% 0%, var(--a1, #2f8f9d) 0%, rgba(0,0,0,0) 60%),
              radial-gradient(100% 120% at 100% 100%, var(--a2, #0b2b30) 0%, rgba(0,0,0,0) 60%);
}
/* tiles with a real app icon: icon is the hero, accent softens */
.tile.has-icon .accent { opacity: 0.55; }
.tile .glyph {
  position: absolute; left: 22px; top: 20px; width: 60px; height: 60px; border-radius: 15px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,240,220,0.10); border: 1px solid rgba(255,240,220,0.14);
  font-family: var(--serif); font-size: 26px; font-weight: 700; overflow: hidden;
}
.tile .glyph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile.has-icon .glyph { background: transparent; border-color: rgba(255,240,220,0.22); }
.tile .label { position: absolute; left: 22px; right: 20px; bottom: 18px; font-size: 23px; font-weight: 500; text-shadow: 0 2px 14px rgba(0,0,0,0.6); }
.tile .sub { position: absolute; left: 22px; bottom: 50px; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--cream-dim); }

@supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  .tile { -webkit-backdrop-filter: blur(22px) saturate(120%); backdrop-filter: blur(22px) saturate(120%); background: rgba(22,18,16,0.46); }
}

/* ---------- footer ---------- */
.hints { display: flex; gap: 30px; font-size: 13px; letter-spacing: 0.12em; color: var(--cream-faint); opacity: 0.8; }
.hints b { color: var(--cream-dim); font-weight: 500; margin-right: 6px; }
.version { position: absolute; right: 96px; bottom: 22px; z-index: 4; font-size: 12px; letter-spacing: 0.14em; color: var(--cream-faint); opacity: 0.6; }

/* ---------- toast ---------- */
.toast {
  position: absolute; z-index: 10; left: 50%; bottom: 120px;
  transform: translate(-50%, 30px); opacity: 0;
  padding: 16px 28px; border-radius: 14px;
  background: rgba(26,22,20,0.82); border: 1px solid var(--glass-edge);
  font-family: var(--serif); font-style: italic; font-size: 22px; color: var(--cream);
  transition: transform 350ms var(--ease), opacity 350ms var(--ease); pointer-events: none;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }

.stage.leaving { opacity: 0; transform: scale(1.04); transition: opacity 320ms ease, transform 420ms var(--ease); }

/* ---------- ambient mode: the scene is the point; UI steps aside ---------- */
.stage .rows, .stage .hints, .stage .brand { transition: opacity 700ms var(--ease), transform 900ms var(--ease); }
body.ambient .stage .rows { opacity: 0; transform: translateY(60px); pointer-events: none; }
body.ambient .stage .hints { opacity: 0; }
body.ambient .stage .hero { transform: translateY(600px) scale(0.72); opacity: 0.95; }
body.ambient .stage .greeting { opacity: 0; }
body.ambient .version { opacity: 0; }
body.ambient #dust { opacity: 0.35; }

/* ---------- Fire TV ---------- */
/* app banners fill the tile; the label is already in the artwork */
.tile.banner .glyph { position: absolute; inset: 0; width: auto; height: auto; margin: 0; border: 0; border-radius: inherit; overflow: hidden; background: #000; }
.tile.banner .label, .tile.banner .sub, .tile.banner .accent { display: none; }
/* the stick's GPU is decoding 1080p video underneath: no live blur behind tiles */

/* Fire TV adapter. When the page runs inside the Aurora Android app (window.AuroraAndroid present),
   expose the small slice of the Tizen API the rest of the code uses, backed by the native bridge.
   Loaded before tizen-mock.js, so the mock stays inert. Does nothing in a desktop browser or on Tizen. */
(function () {
  var A = window.AuroraAndroid;
  if (!A || window.tizen) return;
  window.__AURORA_PLATFORM = 'fire';
  document.documentElement.classList.add('fire');

  var cache = null;
  function apps() {
    if (cache) return cache;
    try { cache = JSON.parse(A.listApps() || '[]'); } catch (e) { cache = []; }
    return cache;
  }

  window.tizen = {
    application: {
      getAppsInfo: function (ok) { setTimeout(function () { cache = null; ok(apps()); }, 0); },
      launch: function (id, ok, err) {
        var done = false;
        try { done = A.launch(id); } catch (e) {}
        setTimeout(function () { if (done) { ok && ok(); } else { err && err({ name: 'NotFound' }); } }, 0);
      },
      launchAppControl: function (c, id, ok, err) { this.launch(id, ok, err); },
      getCurrentApplication: function () { return { exit: function () {} }; }
    },
    tvwindow: {
      setSource: function (s, ok, err) { err && err({ name: 'NotSupported' }); },
      show: function (ok, err) { err && err({ name: 'NotSupported' }); },
      hide: function (ok) { ok && ok(); },
      getSource: function () { return null; }
    },
    tvinputdevice: { registerKey: function () {}, registerKeyBatch: function () {} }
  };

  window.AuroraFire = {
    apps: apps,
    openSettings: function () { try { return A.openSettings(); } catch (e) { return false; } },
    openStockHome: function () { try { return A.openStockHome(); } catch (e) { return false; } },
    log: function (m) { try { A.log(String(m)); } catch (e) {} }
  };

  // when the user comes back from an app, drop the "leaving" fade and refresh the app list once
  window.__auroraResume = function () {

  <script>
/* Footage store: the full-quality loops are too big to ship inside the .wgt (the sideload tool chokes on
   large packages), so the app downloads them once from the footage site onto the TV and plays the local copies.

   On the TV (tizen.filesystem present):
     - each scene's loop lives at wgt-private/scenes/<id>.mp4
     - missing / wrong-size files are downloaded one at a time in the background, current period first
     - until a scene's local copy exists, it streams from the footage site, so nothing ever waits on the download
   Anywhere else (desktop preview): clips come from assets/scenes/<id>/loop.mp4 next to the page, as before. */
window.Footage = (function () {
  var cfg = window.AURORA_CONFIG.footage || {};
  var BASE = (window.__AURORA_FOOTAGE_BASE || cfg.base || '').replace(/\/?$/, '/');
  var hasFs = false;
  function detectFs() { hasFs = !!(window.tizen && tizen.filesystem && tizen.filesystem.openFile); return hasFs; }
  var manifest = null;              // { scenes: { <id>: { file, bytes } } }
  var ready = {};                   // id -> local file URI
  var queue = [], busy = false, failures = {}, listeners = [];
  var DIR = 'wgt-private/scenes';

  function log(m) { try { console.log('[footage] ' + m); } catch (e) {} }
  function emit() { var s = status(); listeners.forEach(function (f) { try { f(s); } catch (e) {} }); }

  function status() {
    if (AA) { try { return JSON.parse(AA.footageStatus()); } catch (e) { return { enabled: true, total: 0, done: 0, busy: false }; } }
    var total = manifest ? Object.keys(manifest.scenes).length : 0;
    return { enabled: hasFs, total: total, done: Object.keys(ready).length, busy: busy };
  }

  function exists(path) {
    try { return tizen.filesystem.pathExists(path); } catch (e) { return false; }
  }
  function sizeOf(path) {
    // Tizen 5+: open read-only and seek to the end
    try { var fh = tizen.filesystem.openFile(path, 'r'); var n = fh.seek(0, 'END'); fh.close(); return n; } catch (e) { return -1; }
  }
  function uri(path) {
    try { return tizen.filesystem.toURI(path); } catch (e) { return null; }
  }
  function ensureDir() {
    try { if (!exists(DIR)) tizen.filesystem.createDirectory(DIR, true); } catch (e) { log('mkdir failed ' + e.message); }
  }

  function checkLocal(id) {
    var m = manifest.scenes[id]; if (!m) return false;
    var p = DIR + '/' + id + '.mp4';
    if (!exists(p)) return false;
    var n = sizeOf(p);
    if (n !== m.bytes) { log(id + ' wrong size ' + n + ' != ' + m.bytes + ', re-downloading'); try { tizen.filesystem.deleteFile(p); } catch (e) {} return false; }
    var u = uri(p); if (!u) return false;
    ready[id] = u; return true;
  }

  function download(id, done) {
    var m = manifest.scenes[id], url = BASE + m.file, tmp = DIR + '/' + id + '.part', dst = DIR + '/' + id + '.mp4';
    log('downloading ' + id + ' (' + Math.round(m.bytes / 1e6) + ' MB)');
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true); xhr.responseType = 'arraybuffer'; xhr.timeout = 10 * 60 * 1000;
    xhr.onload = function () {
      if (xhr.status !== 200 || !xhr.response || xhr.response.byteLength !== m.bytes) {
        log(id + ' bad download: http ' + xhr.status + ', ' + (xhr.response ? xhr.response.byteLength : 0) + ' bytes'); return done(false);
      }
      try {
        var fh = tizen.filesystem.openFile(tmp, 'w');
        fh.writeData(new Uint8Array(xhr.response)); fh.close();
        if (exists(dst)) tizen.filesystem.deleteFile(dst);
        tizen.filesystem.moveFile(tmp, dst, true);
      } catch (e) { log(id + ' write failed: ' + e.message); try { tizen.filesystem.deleteFile(tmp); } catch (x) {} return done(false); }
      done(checkLocal(id));
    };
    xhr.onerror = xhr.ontimeout = function () { log(id + ' network error'); done(false); };
    xhr.send();
  }

  function pump() {
    if (busy || !queue.length) { emit(); return; }
    busy = true; emit();
    var id = queue.shift();
    download(id, function (ok) {
      busy = false;
      if (!ok) {
        failures[id] = (failures[id] || 0) + 1;
        if (failures[id] < 4) setTimeout(function () { queue.push(id); pump(); }, 30000 * failures[id]);   // retry later, at the back
      } else log(id + ' saved');
      emit();
      setTimeout(pump, 500);
    });
  }

  // first-run order: what Auto will show next, then everything else
  // Fire TV: the native app downloads and stores the loops; we just ask it where each one plays from
  var AA = window.AuroraAndroid || null;
  function start(preferPeriod) {
    if (AA) { try { AA.footagePrioritize(preferPeriod || ''); } catch (e) {} emit(); setInterval(emit, 15000); return; }
    detectFs();
    if (!hasFs || !BASE) { emit(); return; }
    var xhr = new XMLHttpRequest();
    xhr.open('GET', BASE + 'manifest.json?t=' + Date.now(), true); xhr.timeout = 20000;
    xhr.onload = function () {
      try { manifest = JSON.parse(xhr.responseText); } catch (e) { log('manifest parse failed'); return retryManifest(preferPeriod); }
      ensureDir();
      var ids = Object.keys(manifest.scenes), missing = ids.filter(function (id) { return !checkLocal(id); });
      var list = window.Scenes ? window.Scenes.list() : [];
      var period = function (id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i].mood; return ''; };
      missing.sort(function (a, b) { return (period(b) === preferPeriod) - (period(a) === preferPeriod); });
      queue = missing; log(ids.length + ' scenes, ' + (ids.length - missing.length) + ' already on the TV');
      pump();
    };
    xhr.onerror = xhr.ontimeout = function () { retryManifest(preferPeriod); };
    xhr.send();
  }
  function retryManifest(p) { log('manifest unavailable, retrying in 60 s'); setTimeout(function () { start(p); }, 60000); }

  // where a scene's loop plays from right now
  function src(scene, file) {
    if (AA) { try { return AA.footageSrc(scene.id); } catch (e) { return BASE + 'scenes/' + scene.id + '.mp4'; } }
    if (!hasFs || !BASE) return 'assets/scenes/' + scene.id + '/' + file;
    if (ready[scene.id]) return ready[scene.id];
    return BASE + 'scenes/' + scene.id + '.mp4';      // stream until the local copy lands
  }

  return { start: start, src: src, status: status, onChange: function (f) { listeners.push(f); } };
})();

  <script>
/* Clock, date, greeting, weather, and the time-of-day period that drives the background. */
window.Widgets = (function () {
  var cfg = window.AURORA_CONFIG;
  var elTime = document.getElementById('time'), elDate = document.getElementById('date'), elGreet = document.getElementById('greeting');
  var days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  var sun = null; // { rise: Date, set: Date } from Open-Meteo; null = use fixed hours

  function minutes(d) { return d.getHours() * 60 + d.getMinutes(); }

  // day → golden (last ~75 min before sunset) → dusk (sunset to +50 min) → night → (dawn counts as golden) → day
  function periodFor(d) {
    var forced = window.__AURORA_FORCE_PERIOD; if (forced) return forced;
    var m = minutes(d);
    var rise = sun ? minutes(sun.rise) : 7 * 60 + 20, set = sun ? minutes(sun.set) : 18 * 60 + 20;
    if (m < rise - 40) return 'night';
    if (m < rise + 45) return 'golden';
    if (m < set - 75) return 'day';
    if (m < set) return 'golden';
    if (m < set + 50) return 'dusk';
    return 'night';
  }

  function tick() {
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    elTime.textContent = h12 + ':' + (m < 10 ? '0' + m : m);
    elDate.textContent = days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate();
    var g = h < 5 ? 'Buonanotte' : h < 12 ? 'Buongiorno' : h < 18 ? 'Buon pomeriggio' : 'Buonasera';
    elGreet.textContent = g + (cfg.name ? ', ' + cfg.name : '');
    window.Sky.show(periodFor(d));
  }

  function describe(code) {
    if (code === 0) return ['☀', 'Clear'];
    if (code <= 2) return ['⛅', 'Partly cloudy'];
    if (code === 3) return ['☁', 'Overcast'];
    if (code <= 48) return ['≋', 'Fog'];
    if (code <= 57) return ['☂', 'Drizzle'];
    if (code <= 67) return ['☔', 'Rain'];
    if (code <= 77) return ['❄', 'Snow'];
    if (code <= 82) return ['☔', 'Showers'];
    if (code <= 86) return ['❄', 'Snow showers'];
    return ['⚡', 'Storms'];
  }

  // weather bucket that drives the scene choice: clear / cloudy / wet (wet borrows the cloudy clips until we shoot rain)
  function kindFor(code) {
    if (code <= 2) return 'clear';
    if (code <= 48) return 'cloudy';
    return 'wet';
  }

  function weather() {
    var w = cfg.weather;
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + w.lat + '&longitude=' + w.lon +
              '&current=temperature_2m,weather_code&daily=sunrise,sunset,temperature_2m_max,temperature_2m_min&temperature_unit=' + w.units + '&timezone=auto';
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true); xhr.timeout = 8000;
    xhr.onload = function () {
      try {
        var j = JSON.parse(xhr.responseText), c = j.current;
        var d = describe(c.weather_code);
        document.getElementById('wx-icon').textContent = d[0];
        document.getElementById('wx-temp').textContent = Math.round(c.temperature_2m) + '°';
        var hilo = (j.daily && j.daily.temperature_2m_max) ? '  ↑' + Math.round(j.daily.temperature_2m_max[0]) + '° ↓' + Math.round(j.daily.temperature_2m_min[0]) + '°' : '';
        document.getElementById('wx-desc').textContent = d[1] + hilo + ' · ' + w.label;
        window.Sky.setWeather(window.__AURORA_FORCE_WEATHER || kindFor(c.weather_code));
        if (j.daily && j.daily.sunrise && j.daily.sunrise[0]) {
          sun = { rise: new Date(j.daily.sunrise[0]), set: new Date(j.daily.sunset[0]) };
          tick();
        }
      } catch (e) {}
    };
    xhr.send();
  }

  return {
    start: function () {
      tick(); setInterval(tick, 1000 * 10);
      weather(); setInterval(weather, 1000 * 60 * 20);
    },
    periodFor: periodFor, kindFor: kindFor
  };
})();

  <script>
/* Builds the three rows from what the TV reports, launches apps, switches HDMI inputs. */
window.Apps = (function () {
  var cfg = window.AURORA_CONFIG;
  var toastEl = document.getElementById('toast'), toastT;

  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove('show'); }, 2400);
  }

  function tile(spec) {
    var el = document.createElement('div');
    el.className = 'tile';
    el.style.setProperty('--a1', spec.a1 || '#3a4fd8');
    el.style.setProperty('--a2', spec.a2 || '#1b2b6b');
    var fallback = spec.glyph || spec.label.charAt(0);
    el.innerHTML = '<div class="accent"></div><div class="glyph">' + fallback + '</div>' +
                   (spec.sub ? '<div class="sub">' + spec.sub + '</div>' : '') +
                   '<div class="label">' + spec.label + '</div>';
    if (spec.icon) {
      // Real app icon from the TV. If the path doesn't load, the glyph stays.
      var img = new Image();
      img.onload = function () { var g = el.querySelector('.glyph'); g.innerHTML = ''; g.appendChild(img); el.classList.add('has-icon'); };
      img.src = spec.icon.indexOf('/') === 0 ? 'file://' + spec.icon : spec.icon;
    }
    if (spec.banner) el.classList.add('banner');
    el.__action = spec.action;
    return el;
  }

  function launchApp(id, label) {
    toast('Opening ' + label);
    document.getElementById('ui').classList.add('leaving');
    setTimeout(function () {
      try {
        tizen.application.launch(id, function () {
          setTimeout(function () { document.getElementById('ui').classList.remove('leaving'); }, 1500);
        }, function (e) {
          document.getElementById('ui').classList.remove('leaving');
          toast('Could not open ' + label + ' (' + (e && e.name || 'error') + ')');
        });
      } catch (e) {
        document.getElementById('ui').classList.remove('leaving');
        toast('Could not open ' + label);
      }
    }, 260);
  }

  function switchInput(num, label) {
    toast('Switching to ' + label);
    try {
      tizen.tvwindow.setSource({ type: 'HDMI', number: num }, function () {
        // Show the TV window full-screen over our UI. Back key hides it again (see nav.js).
        tizen.tvwindow.show(function () { window.__tvwindowShown = true; },
          function (e) { toast('Input set, but could not show window (' + (e && e.name) + ')'); },
          ['0px', '0px', '1920px', '1080px'], 'MAIN');
      }, function (e) {
        toast('Could not switch input (' + (e && e.name || 'error') + ')');
      }, 'MAIN');
    } catch (e) { toast('Input switching not available here'); }
  }

  function hideTvWindow() {
    if (!window.__tvwindowShown) return false;
    try { tizen.tvwindow.hide(function () {}, function () {}, 'MAIN'); } catch (e) {}
    window.__tvwindowShown = false;
    return true;
  }

  var used = {};
  function buildWatch(installed) {
    var row = document.getElementById('row-apps');
    var byName = installed.map(function (a) { return { n: (a.name || '').toLowerCase(), a: a }; });
    cfg.watch.forEach(function (w) {
      var hit = null;
      for (var i = 0; i < byName.length; i++) { if (byName[i].n.indexOf(w.match) !== -1) { hit = byName[i].a; break; } }
      if (!hit && !byName.length) hit = { id: w.id }; // app list unavailable → trust configured IDs
      if (!hit) return;
      var id = hit.id || w.id;
      used[id] = true;
      row.appendChild(tile({ label: w.label, glyph: w.glyph, a1: w.a1, a2: w.a2,
        icon: hit.iconPath && hit.iconPath.length > 0 ? hit.iconPath : null, banner: !!hit.banner,
        action: function () { launchApp(id, w.label); } }));
    });
    if (!row.children.length) {
      row.appendChild(tile({ label: 'No apps found', glyph: '?', action: function () { toast('The TV returned no app list'); } }));
    }
  }

  function buildInputs() {
    var row = document.getElementById('row-inputs');
    cfg.inputs.forEach(function (h) {
      row.appendChild(tile({ label: h.label, sub: h.sub, glyph: h.glyph, a1: h.a1, a2: h.a2,
        action: function () { switchInput(h.number, h.label); } }));
    });
  }

  function buildSystem(installed) {
    var row = document.getElementById('row-system');
    var find = function (frag) {
      for (var i = 0; i < installed.length; i++) if ((installed[i].name || '').toLowerCase().indexOf(frag) !== -1) return installed[i].id;
      return null;
    };
    var tvplus = find('tv plus') || '3201504001965';
    var browser = find('internet') || 'org.tizen.browser';
    var gallery = find('gallery');
    row.appendChild(tile({ label: 'TV Plus', sub: 'Live', glyph: '📺', a1: '#ff6b6b', a2: '#3a0d0d', action: function () { launchApp(tvplus, 'TV Plus'); } }));
    row.appendChild(tile({ label: 'Browser', sub: 'Web', glyph: '🌐', a1: '#4fd1ff', a2: '#062a3a', action: function () { launchApp(browser, 'Browser'); } }));
    if (gallery) row.appendChild(tile({ label: 'Gallery', sub: 'Photos', glyph: '🖼', a1: '#c8a2ff', a2: '#22103a', action: function () { launchApp(gallery, 'Gallery'); } }));
    row.appendChild(tile({ label: 'Scenes', sub: 'Background', glyph: '◐', a1: '#e8b45c', a2: '#3a2a0b', action: function () { window.Picker.show(); } }));
    row.appendChild(tile({ label: 'Samsung Home', sub: 'Stock', glyph: '⌂', a1: '#9aa5b5', a2: '#1a1f28', action: function () {
      // No public API opens Smart Hub; the Home key on the remote still does. Say so.
      toast('Press the Home button on the remote for the Samsung menu');
    } }));
  }

  // ---- Fire TV: row 2 is every other installed app, row 3 is Scenes / Settings / Amazon's own home
  var HIDE = /^(com\.mattheadland\.aurora|com\.spocky\.projengmenu|com\.esaba\.downloader|com\.amazon\.(tv\.launcher|tv\.settings.*|device\..*|ftv\..*|tv\.oobe.*))$/;
  function buildFireApps(installed) {
    var row = document.getElementById('row-inputs');
    var palette = [['#2f8f9d', '#0b2b30'], ['#d2693a', '#3a1a0b'], ['#8a6bb5', '#1e1434'], ['#e8b45c', '#3a2a0b']];
    installed.filter(function (a) { return !used[a.id] && !HIDE.test(a.id); })
      .sort(function (a, b) { return (a.name || '').localeCompare(b.name || ''); })
      .forEach(function (a, i) {
        var c = palette[i % palette.length];
        row.appendChild(tile({ label: a.name, glyph: (a.name || '?').charAt(0), a1: c[0], a2: c[1],
          icon: a.iconPath || null, banner: !!a.banner, action: function () { launchApp(a.id, a.name); } }));
      });
    if (!row.children.length) row.parentNode.style.display = 'none';
  }
  function buildFireSystem() {
    var row = document.getElementById('row-system');
    row.appendChild(tile({ label: 'Scenes', sub: 'Background', glyph: '◐', a1: '#e8b45c', a2: '#3a2a0b', action: function () { window.Picker.show(); } }));
    row.appendChild(tile({ label: 'Settings', sub: 'Fire TV', glyph: '⚙', a1: '#9aa5b5', a2: '#1a1f28', action: function () {
      if (!window.AuroraFire.openSettings()) toast('Could not open Settings');
    } }));
    row.appendChild(tile({ label: 'Amazon Home', sub: 'Stock', glyph: '⌂', a1: '#4fd1ff', a2: '#062a3a', action: function () {
      toast('Amazon home for 10 minutes, then Home comes back here');
      setTimeout(function () { if (!window.AuroraFire.openStockHome()) toast('Could not open Amazon home'); }, 400);
    } }));
  }

  function build(done) {
    var finished = false;
    var fire = window.__AURORA_PLATFORM === 'fire';
    function go(list) {
      if (finished) return; finished = true; buildWatch(list);
      if (fire) { buildFireApps(list); buildFireSystem(); } else { buildInputs(); buildSystem(list); }
      done();
    }
    try {
      tizen.application.getAppsInfo(function (list) { go(list || []); }, function () { go([]); });
      setTimeout(function () { go([]); }, 4000); // never hang the UI on a slow API
    } catch (e) { go([]); }
  }

  return { build: build, toast: toast, hideTvWindow: hideTvWindow };
})();

  <script>
/* Scene picker overlay: left/right choose a scene (or Auto), up/down toggles the motion row,
   OK applies, Back closes. Yellow colour key opens it from anywhere. */
window.Picker = (function () {
  var el = document.getElementById('picker'), row = document.getElementById('picker-scenes');
  var open = false, items = [], idx = 0, onMotion = false;

  function build() {
    row.innerHTML = '';
    items = [{ id: 'auto' }].concat(window.Scenes.list());
    items.forEach(function (it) {
      var c = document.createElement('div');
      if (it.id === 'auto') { c.className = 'pcard auto'; c.innerHTML = '<span class="pc-auto">Auto</span><span class="pc-badge">On</span>'; }
      else {
        c.className = 'pcard';
        c.style.backgroundImage = 'url(assets/scenes/' + it.id + '/' + it.shots[0].img + ')';
        var wx = it.weather === 'clear' ? ' ☀' : it.weather === 'cloudy' ? ' ☁' : '';
        c.innerHTML = '<span class="pc-place">' + it.place + wx + '</span><span class="pc-title">' + it.title + '</span><span class="pc-badge">On</span>';
      }
      c.__id = it.id; row.appendChild(c);
    });
  }

  function render() {
    var cards = [].slice.call(row.children), active = window.Sky.settings.scene;
    cards.forEach(function (c, i) { c.classList.toggle('focused', !onMotion && i === idx); c.classList.toggle('active', c.__id === active); });
    var first = Math.max(0, Math.min(idx - 3, cards.length - 5));
    row.style.transform = 'translateX(' + (-first * 314) + 'px)';
    var g = document.getElementById('picker-motion'); g.classList.toggle('focused', onMotion);
    [].slice.call(g.querySelectorAll('.pill')).forEach(function (p) { p.classList.toggle('on', p.getAttribute('data-motion') === window.Sky.settings.motion); });
    var cur = window.Scenes.current();
    var fs = window.Footage ? window.Footage.status() : null;
    var dl = fs && fs.enabled && fs.total && fs.done < fs.total ? ' · saving footage to the TV ' + fs.done + '/' + fs.total : '';
    document.getElementById('picker-sub').textContent = (active === 'auto'
      ? 'Auto follows the sun and the sky (' + window.Sky.weather() + ')' + (cur ? ' · now showing ' + cur.title : '')
      : 'Pinned') + dl;
  }

  function show() {
    if (!row.children.length) build();
    var active = window.Sky.settings.scene; idx = 0;
    [].slice.call(row.children).forEach(function (c, i) { if (c.__id === active) idx = i; });
    onMotion = false; open = true; el.classList.add('open'); render();
  }
  function hide() { open = false; el.classList.remove('open'); }

  function key(k) {
    if (!open) return false;
    var KEY = { LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, ENTER: 13, BACK: 10009, RETURN: 8 };
    if (k === KEY.BACK || k === KEY.RETURN) { hide(); return true; }
    if (onMotion) {
      var order = ['full', 'reduced', 'off'], mi = order.indexOf(window.Sky.settings.motion);
      if (k === KEY.LEFT) window.Sky.setMotion(order[Math.max(0, mi - 1)]);
      else if (k === KEY.RIGHT) window.Sky.setMotion(order[Math.min(2, mi + 1)]);
      else if (k === KEY.UP) onMotion = false;
      else if (k === KEY.ENTER) hide();
      render(); return true;
    }
    if (k === KEY.LEFT) idx = Math.max(0, idx - 1);
    else if (k === KEY.RIGHT) idx = Math.min(items.length - 1, idx + 1);
    else if (k === KEY.DOWN) onMotion = true;
    else if (k === KEY.ENTER) { window.Sky.setScene(items[idx].id); window.Apps.toast(items[idx].id === 'auto' ? 'Scenes follow the sun' : items[idx].title); }
    render(); return true;
  }

  return { show: show, hide: hide, key: key, isOpen: function () { return open; } };
})();

  <script>
/* D-pad navigation: rows of tiles, focus memory per row, horizontal scroll by transform. */
window.Nav = (function () {
  var rows = [], r = 0, idx = [];
  var KEY = { LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, ENTER: 13, BACK: 10009, EXIT: 10182, RETURN: 8 };

  function init() {
    rows = [].slice.call(document.querySelectorAll('.row')).filter(function (row) { return row.querySelector('.tile'); });
    idx = rows.map(function () { return 0; });
    r = 0;
    render(true);
    document.addEventListener('keydown', onKey);
    armIdle();
    try { tizen.tvinputdevice.registerKey('ColorF2Yellow'); tizen.tvinputdevice.registerKey('ColorF1Green'); tizen.tvinputdevice.registerKey('ColorF3Blue'); } catch (e) {}
  }

  function tilesOf(row) { return [].slice.call(row.querySelectorAll('.tile')); }

  function render(initial) {
    // vertical: rows above the active one fade out and the stack slides up;
    // the hero clock shrinks out of the way once you leave the first row.
    var ROW_PITCH = 243; // row-title + tiles + gap
    document.getElementById('ui').classList.toggle('browsing', r > 0);
    document.querySelector('.rows').style.transform = 'translateY(' + (-(Math.max(0, r)) * ROW_PITCH) + 'px)';
    rows.forEach(function (row, ri) {
      var ts = tilesOf(row);
      row.classList.toggle('active', ri === r);
      row.classList.toggle('passed', ri < r);
      ts.forEach(function (t, ti) { t.classList.toggle('focused', ri === r && ti === idx[ri]); });
      // horizontal scroll: keep focused tile at a comfortable x
      var strip = row.querySelector('.tiles');
      var tileW = 288 + 20, maxVisible = Math.floor((1920 - 192) / tileW);
      var first = Math.max(0, Math.min(idx[ri] - (maxVisible - 2), ts.length - maxVisible));
      strip.style.transform = 'translateX(' + (-first * tileW) + 'px)';
    });
    // the harbor drifts a little with you
    var ts = tilesOf(rows[r]);
    window.Sky.drift(ts.length > 1 ? (idx[r] / (ts.length - 1)) * 2 - 1 : 0, rows.length > 1 ? (r / (rows.length - 1)) * 2 - 1 : 0);
  }

  function current() { var ts = tilesOf(rows[r]); return ts[idx[r]]; }

  var idleTimer = null;
  function armIdle() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { if (!window.Picker.isOpen() && !window.__tvwindowShown) document.body.classList.add("ambient"); }, window.__AURORA_AMBIENT_MS || 14000);
  }
  function wake() {
    var was = document.body.classList.contains('ambient');
    document.body.classList.remove('ambient'); armIdle();
    return was;
  }
  function onKey(e) {
    var k = e.keyCode;
    if (wake()) { e.preventDefault(); return; }   // any key in ambient mode only brings the UI back
    if (k === 406 || k === 405) { e.preventDefault(); if (window.Picker.isOpen()) window.Picker.hide(); else window.Picker.show(); return; } // yellow / blue colour keys
    if (window.Picker.key(k)) { e.preventDefault(); return; }
    if (k === KEY.BACK || k === KEY.RETURN) {
      e.preventDefault();
      if (window.Apps.hideTvWindow()) return;      // Back from an HDMI view returns here
      return;                                        // on the home screen, Back does nothing (stay put)
    }
    if (k === KEY.EXIT) { try { tizen.application.getCurrentApplication().exit(); } catch (x) {} return; }
    if (window.__tvwindowShown) return;              // ignore nav while an input is showing

    if (k === KEY.LEFT)  { idx[r] = Math.max(0, idx[r] - 1); render(); }
    else if (k === KEY.RIGHT) { idx[r] = Math.min(tilesOf(rows[r]).length - 1, idx[r] + 1); render(); }
    else if (k === KEY.UP)    { r = Math.max(0, r - 1); render(); }
    else if (k === KEY.DOWN)  { r = Math.min(rows.length - 1, r + 1); render(); }
    else if (k === KEY.ENTER) { var t = current(); if (t && t.__action) t.__action(); }
    else return;
    e.preventDefault();
  }

  return { init: init };
})();

</script>
